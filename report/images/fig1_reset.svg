<text x="228" y="22.0" font-size="13" fill="#6c7086" text-anchor="middle">GDB: 加电复位现场与复位向量反汇编</text>
<text x="18" y="64" font-size="14" xml:space="preserve" fill="#a6e3a1">(gdb) p/x $pc</text>
<text x="18" y="85" font-size="14" xml:space="preserve" fill="#cdd6f4">$1 = 0x1000</text>
<text x="18" y="106" font-size="14" xml:space="preserve" fill="#a6e3a1">(gdb) info registers a0 a1 a2 t0 sp</text>
<text x="18" y="127" font-size="14" xml:space="preserve" fill="#cdd6f4">a0             0x0      0</text>
<text x="18" y="148" font-size="14" xml:space="preserve" fill="#cdd6f4">a1             0x0      0</text>
<text x="18" y="169" font-size="14" xml:space="preserve" fill="#cdd6f4">a2             0x0      0</text>
<text x="18" y="190" font-size="14" xml:space="preserve" fill="#cdd6f4">t0             0x0      0</text>
<text x="18" y="211" font-size="14" xml:space="preserve" fill="#cdd6f4">sp             0x0      0x0</text>
<text x="18" y="232" font-size="14" xml:space="preserve" fill="#a6e3a1">(gdb) x/6i 0x1000</text>
<text x="18" y="253" font-size="14" xml:space="preserve" fill="#f9e2af">=&gt; 0x1000:      auipc   t0,0x0</text>
<text x="18" y="274" font-size="14" xml:space="preserve" fill="#cdd6f4">   0x1004:      addi    a2,t0,40</text>
<text x="18" y="295" font-size="14" xml:space="preserve" fill="#cdd6f4">   0x1008:      csrr    a0,mhartid</text>
<text x="18" y="316" font-size="14" xml:space="preserve" fill="#cdd6f4">   0x100c:      ld      a1,32(t0)</text>
<text x="18" y="337" font-size="14" xml:space="preserve" fill="#cdd6f4">   0x1010:      ld      t0,24(t0)</text>
<text x="18" y="358" font-size="14" xml:space="preserve" fill="#cdd6f4">   0x1014:      jr      t0</text>
<text x="18" y="379" font-size="14" xml:space="preserve" fill="#a6e3a1">(gdb) x/6gx 0x1018</text>
<text x="18" y="400" font-size="14" xml:space="preserve" fill="#cdd6f4">0x1018: 0x0000000080000000      0x0000000087000000</text>
<text x="18" y="421" font-size="14" xml:space="preserve" fill="#cdd6f4">0x1028: 0x000000004942534f      0x0000000000000002</text>
<text x="18" y="442" font-size="14" xml:space="preserve" fill="#cdd6f4">0x1038: 0x0000000080200000      0x0000000000000001</text>
